# ==========================================
# CORA - Application Configuration Example
# ==========================================
# Copy this file to application.properties
# and provide the required environment variables.

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Groq - Chat Model
# ==========================================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# ==========================================
# Jina AI - Code Embeddings
# ==========================================
spring.ai.openai.embedding.api-key=${JINA_API_KEY}
spring.ai.openai.embedding.base-url=https://api.jina.ai
spring.ai.openai.embedding.options.model=jina-code-embeddings-1.5b

# ==========================================
# pgvector
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ==========================================
# CORA Application
# ==========================================
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}
app.github.api-delay-ms=50
app.indexing.chunk-size=800
app.indexing.max-file-bytes=102400